name: marlow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marlow
      POSTGRES_PASSWORD: marlow
      POSTGRES_DB: marlow
    volumes:
      - marlow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marlow -d marlow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  hotels:
    build:
      context: .
      dockerfile: apps/hotels/Dockerfile
    environment:
      DATABASE_URL: postgres://marlow:marlow@postgres:5432/marlow
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50051"
      HEALTH_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      PORT: "4000"
      HOTELS_GRPC_ADDR: hotels:50051
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-change-me
      AUTH_MODE: ${COMPOSE_AUTH_MODE:-mock}
      PUBLIC_WEB_URL: http://localhost:8080
      WEB_ORIGIN: http://localhost:8080
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8080/auth/github/callback}
      COOKIE_SECURE: "false"
      SEARCH_CACHE_TTL_SECONDS: "60"
    depends_on:
      hotels:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  marlow-pg:
